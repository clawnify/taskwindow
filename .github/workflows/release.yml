name: release

# A push to main whose version has no tag yet releases it: the version bump is
# the release decision, and a tag someone forgets to push left the Web Store
# on 0.2.9 while npm stayed on 0.2.8. The tag is created in this same run,
# because a tag pushed with GITHUB_TOKEN never starts another workflow.
# Pushing a v* tag by hand still releases.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install daemon deps
        run: npm ci
        working-directory: daemon
      - name: Daemon end-to-end tests (fake extension + real MCP client)
        run: npm test
        working-directory: daemon
      - name: GIF encoder round-trip tests
        run: node test/gif-encoder.test.mjs
        working-directory: daemon

  release:
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the version to release
        id: version
        run: |
          daemon=$(jq -r .version daemon/package.json)
          manifest=$(jq -r .version extension/manifest.json)
          extension=$(jq -r .version extension/package.json)
          if [ "$daemon" != "$manifest" ] || [ "$daemon" != "$extension" ]; then
            echo "::error::version mismatch: daemon/package.json $daemon, extension/manifest.json $manifest, extension/package.json $extension"
            exit 1
          fi
          tag="v$daemon"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $daemon"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = branch ] && git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag is already released"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Package extension (loadable via chrome://extensions)
        if: steps.version.outputs.skip != 'true'
        run: |
          cd extension
          zip -qr "../TaskWindow-extension-${TAG}.zip" .
      - name: Package daemon (npx-ready)
        if: steps.version.outputs.skip != 'true'
        run: |
          cp README.md daemon/README.md
          cp LICENSE daemon/LICENSE
          cd daemon
          zip -qr "../TaskWindow-daemon-${TAG}.zip" . -x "node_modules/*"
      - name: Create GitHub release (and the tag, when releasing from main)
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes = this version's CHANGELOG.md section + the install
          # boilerplate. Deliberately not the tag annotation: `git tag -m`
          # strips lines starting with '#', which silently eats markdown
          # headings. A missing section just yields install-only notes.
          awk -v v="${TAG#v}" '
            $0 ~ "^## +"v"([^0-9.]|$)" { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > notes.md || : > notes.md
          if [ -s notes.md ]; then printf '\n' >> notes.md; fi
          cat >> notes.md <<'EOF'
          ## Install

          Run `npm install -g taskwindow@latest`, then `taskwindow install`. The guided installer configures the daemon and selected coding agents and opens the [Chrome Web Store listing](https://chromewebstore.google.com/detail/adbfpkbjndcpjihceobeegkokblgifpe); the extension pairs on its own after "Add to Chrome" and Chrome keeps it updated.

          Manual archives are attached below (the extension zip is for `taskwindow install --extension <zip>`, the unpacked development route). Run `taskwindow doctor` for connection diagnostics or `taskwindow pair` for manual recovery.

          See the README for the full guide.
          EOF
          gh release create "$TAG" \
            "TaskWindow-extension-${TAG}.zip" \
            "TaskWindow-daemon-${TAG}.zip" \
            --target "$GITHUB_SHA" \
            --title "TaskWindow ${TAG}" \
            --notes-file notes.md
      - name: Publish daemon to npm
        if: steps.version.outputs.skip != 'true'
        working-directory: daemon
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN secret not set — skipping npm publish"
            exit 0
          fi
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
          npm publish --access public
